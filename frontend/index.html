<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/leaf.svg" />
    <link rel="apple-touch-icon" href="/leaf.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Agronomic Vision & Advisory Engine — photograph a diseased leaf and get a severity-grounded treatment plan backed by agricultural extension material." />
    <meta name="theme-color" content="#f5f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1311" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>AgroVision — Crop Disease Advisory</title>
    <script>
      // Apply a saved theme before first paint so there is no light/dark flash.
      try {
        var t = localStorage.getItem('agrovision_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
